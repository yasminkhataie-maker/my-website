help:
  heading: What I help with
  cards:
  - title: Market entry strategy for Saudi Arabia and the GCC
    text: Before you launch, I research how your audience actually behaves, buys and learns in the market, then shape your entry around it. Localisation is more than language.
  - title: Brand positioning for the region
    text: I reposition brands so they show up in a way the GCC audience recognises, without losing who they are.
  - title: Marketing strategy and diagnosis
    text: 'When marketing stops working, I find where the story breaks and set clear priorities: what to say, to whom, and what to fix first.'
