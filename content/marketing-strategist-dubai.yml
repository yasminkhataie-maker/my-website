faq_heading: Frequently asked questions
faq:
- q: Where are you based?
  a: In Dubai, UAE. I work with clients across the UAE, Saudi Arabia, the wider GCC and Australia, in person and online.
- q: Do you only work with companies in Dubai?
  a: No. Many clients are companies outside the region planning to enter it, or regional companies expanding into Saudi Arabia.
- q: How do engagements work?
  a: They are session-based. Most start with a 20-minute clarity conversation, followed by the Narrative Clarity Diagnostic.
- q: Do you also run the marketing?
  a: My focus is strategy, narrative and system design. If you need execution, I can brief your team or manage a team for you.
- q: How do I get started?
  a: Book a 20-minute clarity conversation. There is no obligation.
cta:
  heading: Ready to talk?
  text: If you are entering a new market, repositioning your brand or your marketing needs a fix, let's start with a conversation.
