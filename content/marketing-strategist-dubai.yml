intro: I'm Yasmin Khataie, a marketing strategist based in Dubai and the founder of Veloxitas. I help companies enter the UAE, Saudi Arabia and the wider GCC, reposition their brands for the region, and fix marketing that has stopped working. I work across the GCC and Australia.
